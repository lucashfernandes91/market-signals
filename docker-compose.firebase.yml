services:
  notification-worker:
    environment:
      NOTIFICATION_PROVIDER: fcm
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase-service-account.json
    volumes:
      - backend_data:/app/data
      - ${FIREBASE_CREDENTIALS_HOST_PATH:?Defina FIREBASE_CREDENTIALS_HOST_PATH}:/run/secrets/firebase-service-account.json:ro

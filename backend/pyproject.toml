[project]
name = "market-radar-backend"
version = "0.1.0"
description = "Backend do Market Radar"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "channels>=4.3,<5",
    "channels-redis>=4.3,<5",
    "daphne>=4.2,<5",
    "django>=5.2,<5.3",
    "django-cors-headers>=4.7,<5",
    "djangorestframework>=3.16,<4",
    "djangorestframework-simplejwt>=5.5,<6",
    "firebase-admin>=6.9,<7",
    "orjson>=3.11,<4",
    "psycopg[binary]>=3.2,<4",
    "redis>=8.1,<9",
    "websockets>=15,<16",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.1",
    "djangorestframework-stubs>=3.18.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.13",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings.test"
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "core.settings.test"

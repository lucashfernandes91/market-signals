[project]
name = "market-radar-backend"
version = "0.1.0"
description = "Backend do Market Radar"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "channels>=4.3,<5",
    "channels-redis>=4.3,<5",
    "daphne>=4.2,<5",
    "django>=5.2,<5.3",
    "django-cors-headers>=4.7,<5",
    "djangorestframework>=3.16,<4",
    "djangorestframework-simplejwt>=5.5,<6",
    "orjson>=3.11,<4",
    "redis>=8.1,<9",
]

[dependency-groups]
dev = [
    "ruff>=0.13",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

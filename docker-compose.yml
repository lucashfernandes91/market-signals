name: market-radar-dev

services:
  redis:
    image: redis:8.2.10-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infra/docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./backend
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && python manage.py seed_market && exec daphne -b 0.0.0.0 -p 8000 core.asgi:application
    environment: &backend-environment
      DJANGO_SETTINGS_MODULE: core.settings.development
      DJANGO_SECRET_KEY: django-insecure-compose-development-only
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      REDIS_URL: redis://redis:6379/0
      MARKET_PROVIDER: ${MARKET_PROVIDER:-binance}
      PERSONAL_MODE_ENABLED: ${PERSONAL_MODE_ENABLED:-true}
      PERSONAL_MODE_EMAIL: ${PERSONAL_MODE_EMAIL:-personal@market-radar.local}
      SERVICE_NAME: web
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-stub}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-/run/secrets/firebase-service-account.json}
    ports:
      - "0.0.0.0:${MARKET_RADAR_WEB_PORT:-8001}:8000"
    volumes:
      - backend_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=5).close()"]
      interval: 10s
      timeout: 7s
      retries: 6
      start_period: 30s

  market-ingestor:
    build:
      context: ./backend
    command: ["python", "manage.py", "run_market_ingestor"]
    environment:
      <<: *backend-environment
      SERVICE_NAME: market-ingestor
    volumes:
      - backend_data:/app/data
    depends_on:
      web:
        condition: service_healthy

  market-watchdog:
    build:
      context: ./backend
    command: ["python", "manage.py", "run_market_watchdog"]
    environment:
      <<: *backend-environment
      SERVICE_NAME: market-watchdog
      MARKET_STALE_CHECK_SECONDS: ${MARKET_STALE_CHECK_SECONDS:-5}
      MARKET_STALE_AFTER_SECONDS: ${MARKET_STALE_AFTER_SECONDS:-15}
    volumes:
      - backend_data:/app/data
    depends_on:
      web:
        condition: service_healthy

  alert-worker:
    build:
      context: ./backend
    command: ["python", "manage.py", "run_alert_worker"]
    environment:
      <<: *backend-environment
      SERVICE_NAME: alert-worker
    volumes:
      - backend_data:/app/data
    depends_on:
      web:
        condition: service_healthy

  notification-worker:
    build:
      context: ./backend
    command: ["python", "manage.py", "run_notification_worker"]
    environment:
      <<: *backend-environment
      SERVICE_NAME: notification-worker
    volumes:
      - backend_data:/app/data
    depends_on:
      web:
        condition: service_healthy

volumes:
  backend_data:
  redis_data:
